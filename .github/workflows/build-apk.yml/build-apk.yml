name: Build UNNAL MUDIYUM APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Extract zip
        run: |
          find . -name "*.zip" -exec unzip -q {} +

      - name: Build APK
        run: |
          find . -maxdepth 3 -name "build.gradle*" -exec dirname {} + | while read dir; do
            if [ -f "$dir/gradlew" ]; then
              cd "$dir" && ./gradlew assembleDebug
              break
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: **/app-debug.apk

