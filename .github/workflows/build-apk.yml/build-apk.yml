
name: Build UNNAL MUDIYUM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q unnal-mudiyum-github-ready.zip -d extracted

      - name: Build APK
        working-directory: extracted/unnal-mudiyum-android
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unnal-mudiyum-debug-apk
          path: extracted/unnal-mudiyum-android/app/build/outputs/apk/debug/app-debug.apk
          
